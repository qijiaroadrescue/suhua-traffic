name: update-data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # 備援；主要由 cron-job.org 觸發

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run TDX Fetch Script
        run: node fetch-tdx.mjs
        env:
          TDX_ID: ${{ secrets.TDX_ID }}
          TDX_SECRET: ${{ secrets.TDX_SECRET }}

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name "data-bot"
          git config --global user.email "bot@github.actions"
          git add data/
          git diff --staged --quiet || (git commit -m "update data [skip ci]" && git pull --rebase && git push)
