  <!-- Vue 3 主程式 -->
  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const direction = ref('south');
        const updateTimeDisplay = ref('--:--');
        const dataAgeMin = ref(0);
        const fetchAgeMin = ref(0);
        const fetchFailed = ref(false);
        const tick = ref(Date.now());
        const vdRawData = ref([]);
        const newsRawData = ref([]);
        const cctvRawData = ref([]);

        const segmentsConfig = {
          south: [
            { key: 'dongao', name: '蘇澳 ⇄ 東澳 (東澳隧道)', mileage: '台9線 104K-113K', limit: 70, vdPatterns: ['104', '106', '107', '111', '112'] },
            { key: 'guanyin', name: '南澳 ⇄ 和平 (觀音/谷風)', mileage: '台9線 124K-145K', limit: 70, vdPatterns: ['125', '127', '128', '129', '130', '135', '138', '140', '141'] },
            { key: 'zhongren', name: '和中 ⇄ 大清水 (中仁/仁水)', mileage: '台9線 148K-160K', limit: 60, vdPatterns: ['149', '150', '151', '152', '155', '156', '157', '158'] }
          ],
          north: [
            { key: 'zhongren', name: '大清水 ⇄ 和中 (仁水/中仁)', mileage: '台9線 160K-148K', limit: 60, vdPatterns: ['158', '157', '156', '155', '152', '151', '150', '149'] },
            { key: 'guanyin', name: '和平 ⇄ 南澳 (谷風/觀音)', mileage: '台9線 145K-124K', limit: 70, vdPatterns: ['141', '140', '138', '135', '130', '129', '128', '127', '125'] },
            { key: 'dongao', name: '東澳 ⇄ 蘇澳 (東澳隧道)', mileage: '台9線 113K-104K', limit: 70, vdPatterns: ['112', '111', '107', '106', '104'] }
          ]
        };

        const camSection = ref('all');
        const showAllCams = ref(false);
        const camSections = [
          { key: 'all', label: '全部' },
          { key: 'a', label: '蘇澳–東澳' },
          { key: 'b', label: '南澳–和平' },
          { key: 'c', label: '和中–大清水' },
          { key: 'd', label: '崇德–花蓮' }
        ];
        // 想增加或刪除點位，只要改這份清單：[CCTVID, 樁號, 方向, 區段, 重點名稱(有填才算重點)]
        const camTargets = [
          ['CCTV-42-0090-102-002', '102K+930', '南下', 'a'],
          ['CCTV-42-0090-104-001', '104K+183', '', 'a', '蘇澳端入口'],
          ['CCTV-42-0090-107-003', '107K+965', '南下', 'a'],
          ['CCTV-42-0090-109-007', '109K+237', '南下', 'a'],
          ['CCTV-42-0090-112-002', '112K+691', '南下', 'a', '東澳隧道口'],
          ['CCTV-42-0090-113-001', '113K+181', '南下', 'a'],
          ['CCTV-42-0090-125-001', '125K+412', '南下', 'b'],
          ['CCTV-42-0090-128-006', '128K+342', '北上', 'b', '觀音隧道北口'],
          ['CCTV-42-0090-131-018', '131K+782', '南下', 'b'],
          ['CCTV-42-0090-135-019', '135K+842', '南下', 'b'],
          ['CCTV-42-0090-139-018', '139K+661', '南下', 'b'],
          ['CCTV-42-0090-141-017', '141K+760', '南下', 'b', '谷風隧道南口'],
          ['CCTV-42-0090-144-003', '144K+011', '北上', 'b'],
          ['CCTV-42-0090-148-001', '148K+820', '北上', 'c'],
          ['CCTV-42-0090-149-001', '149K+118', '南下', 'c', '中仁隧道北口'],
          ['CCTV-42-0090-151-013', '151K+584', '南下', 'c'],
          ['CCTV-42-0090-155-001', '155K+129', '北上', 'c', '仁水隧道段'],
          ['CCTV-42-0090-157-018', '157K+532', '南下', 'c'],
          ['CCTV-42-0090-158-001', '158K+036', '北上', 'c', '大清水端'],
          ['CCTV-42-0090-162-004', '162K+780', '', 'd'],
          ['CCTV-42-0090-166-002', '166K+230', '', 'd', '崇德管制端'],
          ['CCTV-43-0090-173-001', '173K+930', '', 'd'],
          ['CCTV-43-0090-177-001', '177K+895', '', 'd']
        ].map(([id, mile, dir, sec, name]) => ({ id, mile, dir, sec, name }));

        const loadData = async () => {
          try {
            tick.value = Date.now();
            const timestamp = tick.value;

            const vdRes = await fetch(`./data/vd.json?t=${timestamp}`);
            if (vdRes.ok) {
              const vdJson = await vdRes.json();
              vdRawData.value = vdJson.VDLives || [];
              if (vdJson.UpdateTime) {
                const date = new Date(vdJson.UpdateTime);
                updateTimeDisplay.value = date.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                dataAgeMin.value = Math.round((Date.now() - date.getTime()) / 60000);
              }
            }

            const newsRes = await fetch(`./data/news.json?t=${timestamp}`);
            if (newsRes.ok) {
              const newsJson = await newsRes.json();
              newsRawData.value = newsJson.Newses || [];
            }

            // 監視器清單很大且一天才更新一次，只在第一次載入時讀取；快照圖片本身仍每分鐘更新
            if (cctvRawData.value.length === 0) {
              const cctvRes = await fetch(`./data/cctv.json?t=${timestamp}`);
              if (cctvRes.ok) {
                const cctvJson = await cctvRes.json();
                cctvRawData.value = cctvJson.CCTVs || [];
              }
            }

            // 讀取排程執行紀錄，分辨「排程沒跑」還是「公路局來源沒更新」
            const stRes = await fetch(`./data/status.json?t=${timestamp}`);
            if (stRes.ok) {
              const st = await stRes.json();
              if (st.updated) fetchAgeMin.value = Math.round((Date.now() - new Date(st.updated).getTime()) / 60000);
              fetchFailed.value = Object.values(st.results || {}).some(v => v !== 'ok');
            }
          } catch (e) {
            console.error('同步即時路況資料時發生錯誤:', e);
          }
        };

        // 各路段車速（沒有資料時為 null，不再假裝順暢）
        const currentSegments = computed(() => {
          const list = segmentsConfig[direction.value];
          return list.map(seg => {
            const matchedVDs = vdRawData.value.filter(item => {
              if (!item.VDID || !item.VDID.includes('0090')) return false;
              return seg.vdPatterns.some(pat => item.VDID.includes(`-${pat}-`));
            });

            const speeds = [];
            matchedVDs.forEach(vd => {
              (vd.LinkFlows || []).forEach(link => {
                (link.Lanes || []).forEach(lane => {
                  if (lane.Speed > 0 && lane.Speed < 140) speeds.push(lane.Speed);
                });
              });
            });

            const avgSpeed = speeds.length > 0
              ? Math.round(speeds.reduce((a, b) => a + b, 0) / speeds.length)
              : null;

            return { ...seg, speed: avgSpeed };
          });
        });

        const overallAvgSpeed = computed(() => {
          const valid = currentSegments.value.filter(s => s.speed !== null);
          if (!valid.length) return null;
          return Math.round(valid.reduce((a, b) => a + b.speed, 0) / valid.length);
        });

        const totalEstimatedMinutes = computed(() =>
          overallAvgSpeed.value ? Math.round((60 / overallAvgSpeed.value) * 60) : null
        );

        // 蘇花相關通報
        const filteredNews = computed(() => {
          return newsRawData.value.filter(n => {
            const title = n.Title || '';
            const desc = n.Description || '';
            if (title.includes('國5路況專區')) return false; // 國5 資料另外處理，不放進蘇花警報
            return title.includes('台9') || title.includes('蘇花') || desc.includes('蘇澳') || desc.includes('崇德') || desc.includes('東澳') || desc.includes('和平');
          }).slice(0, 3);
        });

        // 通報含「封閉／中斷／封路」時，優先顯示警示
        const hasClosure = computed(() =>
          filteredNews.value.some(n => /封閉|中斷|封路|阻斷/.test((n.Title || '') + (n.Description || '')))
        );

        // 從「高速公路局國5路況專區」擷取蘇澳→南港車程與蘇澳交流道排隊
        const freeway5 = computed(() => {
          const n = newsRawData.value.find(x => (x.Title || '').includes('國5路況專區'));
          if (!n) return null;
          const text = (n.Description || '') + (n.Content || '');
          const t = text.match(/蘇澳海山西路至國5南港系統：(\d+)分/);
          if (!t) return null;
          const q = text.match(/蘇澳海山西路至國5蘇澳交流道入口：排隊(\d+(?:\.\d+)?)公里/);
          let queueText = '蘇澳交流道排隊資料暫缺';
          if (q) queueText = Number(q[1]) > 0 ? `目前蘇澳交流道排隊 ${q[1]} 公里` : '目前蘇澳交流道無排隊';
          return { minutes: Number(t[1]), queueText };
        });

        const decision = computed(() => {
          const spd = overallAvgSpeed.value;
          if (hasClosure.value) {
            return {
              title: '有封閉／中斷通報・出發前請先確認',
              desc: '下方通報提到封閉或中斷，請先閱讀管制內容，或至公路局 168 確認最新放行時間。'
            };
          }
          if (spd === null) {
            return {
              title: '暫無車速資料・請先確認管制訊息',
              desc: '目前無法取得即時車速（可能資料更新中或路段管制），請參考下方通報與 CCTV，或至公路局 168 確認。'
            };
          }
          if (spd >= 55) return { title: '蘇花全線順暢・適合出發', desc: '蘇澳至崇德各隧道車流流暢，蘇花改全線維持均速前行。' };
          if (spd >= 38) return { title: '車流偏多・留意車距', desc: '隧道出口或銜接路段車速稍有放緩，請保持行車安全距離。' };
          return { title: '路況壅塞・建議稍候', desc: '長隧道區間或管制點車速低於 35 km/h，預估有排隊回堵，出發前請確認管制訊息。' };
        });

        // CCTV 快照網址加時間參數，瀏覽器才會真的重新載入圖片
        const cctvAll = computed(() => {
          const list = [];
          camTargets.forEach(t => {
            // 先用 CCTVID 精準比對，找不到再用樁號比對
            const found = cctvRawData.value.find(c => c.CCTVID === t.id)
              || cctvRawData.value.find(c =>
                   (c.RoadName === '台9線' || c.RoadID === '300090') &&
                   c.LocationMile && String(c.LocationMile).replace(/\s/g, '').includes(t.mile));
            if (found && found.VideoImageURL) {
              const url = found.VideoImageURL;
              list.push({
                id: t.id,
                sec: t.sec,
                named: !!t.name,
                title: t.name || (t.mile + ' ' + t.dir).trim(),
                desc: found.SurveillanceDescription || (t.dir ? t.dir + '方向' : '台9線'),
                mileage: found.LocationMile || t.mile,
                snapshotUrl: url + (url.includes('?') ? '&' : '?') + 't=' + tick.value
              });
            }
          });
          return list;
        });

        // 「全部」預設只顯示重點點位，按按鈕才展開全部
        const cctvList = computed(() => {
          if (camSection.value !== 'all') return cctvAll.value.filter(c => c.sec === camSection.value);
          return showAllCams.value ? cctvAll.value : cctvAll.value.filter(c => c.named);
        });

        const getStatusBadge = (spd) => {
          if (spd === null) return 'bg-slate-500/20 text-slate-400';
          if (spd >= 55) return 'bg-emerald-500/20 text-emerald-400';
          if (spd >= 35) return 'bg-amber-500/20 text-amber-400';
          return 'bg-rose-500/20 text-rose-400';
        };

        const getStatusText = (spd) => {
          if (spd === null) return '無資料';
          if (spd >= 55) return '順暢';
          if (spd >= 35) return '車多';
          return '壅塞';
        };

        const getSpeedColor = (spd) => {
          if (spd === null) return 'text-slate-400';
          if (spd >= 55) return 'text-emerald-400';
          if (spd >= 35) return 'text-amber-400';
          return 'text-rose-400';
        };

        const getBarColor = (spd) => {
          if (spd === null) return 'bg-slate-600';
          if (spd >= 55) return 'bg-emerald-500';
          if (spd >= 35) return 'bg-amber-500';
          return 'bg-rose-500';
        };

        const handleImgError = (e) => {
          e.target.src = 'https://placehold.co/400x225/111827/64748b?text=CCTV+Connecting...';
        };

        onMounted(() => {
          loadData();
          setInterval(loadData, 60000); // 每 60 秒重新讀取一次
        });

        return {
          direction, updateTimeDisplay, dataAgeMin, fetchAgeMin, fetchFailed, currentSegments, overallAvgSpeed,
          totalEstimatedMinutes, decision, hasClosure, filteredNews, freeway5, cctvList, cctvAll, camSection, showAllCams, camSections,
          getStatusBadge, getStatusText, getSpeedColor, getBarColor, handleImgError
        };
      },
      template: `
        <div class="max-w-4xl mx-auto px-4 pt-6">
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-800 gap-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 pulse-dot"></span>
                <h1 class="text-2xl font-bold tracking-tight text-white">蘇花哨兵 Suhua Sentinel</h1>
              </div>
              <p class="text-xs text-slate-400 mt-1">台9線蘇花改・即時路況、管制通報與通行決策</p>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
              <div class="text-right">
                <div class="text-[11px] text-slate-400">公路局 TDX 即時資料</div>
                <div class="text-xs font-mono text-emerald-400">{{ updateTimeDisplay }}</div>
                <div v-if="fetchAgeMin > 30" class="text-[11px] text-amber-400">⚠️ 自動更新已 {{ fetchAgeMin }} 分鐘沒有執行</div>
                <div v-else-if="fetchFailed" class="text-[11px] text-amber-400">⚠️ 最近一次抓取失敗，顯示的是舊資料</div>
                <div v-else-if="dataAgeMin > 30" class="text-[11px] text-amber-400">⚠️ 公路局來源資料已 {{ dataAgeMin }} 分鐘未更新</div>
              </div>
              <div class="bg-slate-800/90 p-1 rounded-xl flex text-xs font-medium border border-slate-700/50">
                <button
                  @click="direction = 'south'"
                  :class="direction === 'south' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">
                  南下 宜蘭往花蓮
                </button>
                <button
                  @click="direction = 'north'"
                  :class="direction === 'north' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">
                  北上 花蓮往宜蘭
                </button>
              </div>
            </div>
          </header>

          <section class="mt-6 glass-card rounded-2xl p-6 relative overflow-hidden border-indigo-500/20">
            <div class="flex flex-col md:flex-row justify-between gap-6">
              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold mb-2"
                     :class="hasClosure ? 'bg-rose-500/20 text-rose-300' : (overallAvgSpeed === null ? 'bg-slate-500/20 text-slate-300' : 'bg-emerald-500/20 text-emerald-300')">
                  <span>● 哨兵綜合決策</span>
                </div>
                <h2 class="text-2xl font-extrabold text-white">{{ decision.title }}</h2>
                <p class="text-sm text-slate-300 mt-1.5 max-w-lg leading-relaxed">{{ decision.desc }}</p>
              </div>

              <div class="flex gap-4 items-center bg-slate-900/80 p-4 rounded-xl border border-slate-800 shrink-0">
                <div>
                  <div class="text-xs text-slate-400">蘇澳 ⇄ 崇德 車程</div>
                  <div class="text-2xl font-bold font-mono text-emerald-400">{{ totalEstimatedMinutes ?? '--' }} <span class="text-xs text-slate-400">分</span></div>
                </div>
                <div class="w-px h-8 bg-slate-800"></div>
                <div>
                  <div class="text-xs text-slate-400">全線均速</div>
                  <div class="text-2xl font-bold font-mono text-white">{{ overallAvgSpeed ?? '--' }} <span class="text-xs text-slate-400">km/h</span></div>
                </div>
              </div>
            </div>

            <div v-if="filteredNews.length > 0" class="mt-5 pt-4 border-t border-slate-800">
              <div class="text-xs font-bold text-amber-400 mb-2">⚠️ 蘇花路段即時管制／施工通報</div>
              <div class="space-y-2">
                <div v-for="news in filteredNews" :key="news.NewsID" class="text-xs bg-amber-500/10 p-3 rounded-lg border border-amber-500/20">
                  <div class="text-amber-300 font-semibold mb-1">{{ news.Title }}</div>
                  <div class="text-slate-300 leading-relaxed">{{ news.Description }}</div>
                </div>
              </div>
            </div>
          </section>

          <section class="mt-8">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">蘇花改各重點隧道區間車速 (VD 偵測)</h3>
              <span class="text-[11px] text-slate-500">速限 60-70 km/h</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div v-for="seg in currentSegments" :key="seg.key" class="glass-card rounded-xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                  <div>
                    <span class="text-[11px] font-mono text-indigo-400">{{ seg.mileage }}</span>
                    <h4 class="font-bold text-base text-white mt-0.5">{{ seg.name }}</h4>
                  </div>
                  <span :class="getStatusBadge(seg.speed)" class="text-[11px] px-2 py-0.5 rounded font-medium">
                    {{ getStatusText(seg.speed) }}
                  </span>
                </div>

                <div class="flex items-baseline gap-2 mt-2">
                  <span class="text-3xl font-extrabold font-mono" :class="getSpeedColor(seg.speed)">
                    {{ seg.speed !== null ? seg.speed : '--' }}
                  </span>
                  <span class="text-xs text-slate-400">km/h (速限 {{ seg.limit }})</span>
                </div>

                <div class="w-full bg-slate-800/80 h-1.5 rounded-full mt-3 overflow-hidden">
                  <div
                    class="h-full rounded-full transition-all"
                    :class="getBarColor(seg.speed)"
                    :style="{ width: seg.speed === null ? '0%' : Math.min(100, (seg.speed / seg.limit) * 100) + '%' }">
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="mt-8">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">關鍵點位 CCTV 快照</h3>
              <span class="text-[11px] text-slate-500">快照每分鐘更新・路況資料每 10 分鐘同步</span>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 mb-3 text-xs">
              <button v-for="s in camSections" :key="s.key" @click="camSection = s.key"
                :class="camSection === s.key ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'"
                class="px-3 py-1.5 rounded-lg whitespace-nowrap transition-all">{{ s.label }}</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
              <div v-for="cam in cctvList" :key="cam.id" class="glass-card rounded-xl overflow-hidden group">
                <div class="relative bg-slate-900 aspect-video flex items-center justify-center overflow-hidden">
                  <img
                    :src="cam.snapshotUrl"
                    :alt="cam.title"
                    loading="lazy"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                    @error="handleImgError($event)"
                  />
                  <span class="absolute top-2 left-2 bg-black/70 backdrop-blur text-[10px] text-white px-1.5 py-0.5 rounded">
                    {{ cam.mileage }}
                  </span>
                </div>
                <div class="p-2.5">
                  <div class="text-xs font-semibold text-white truncate">{{ cam.title }}</div>
                  <div class="text-[11px] text-slate-400 mt-0.5 truncate">{{ cam.desc }}</div>
                </div>
              </div>
            </div>

            <p v-if="cctvList.length === 0" class="text-xs text-slate-500 mt-2">目前沒有可顯示的影像，請稍後再試。</p>

            <div v-if="camSection === 'all'" class="mt-4 text-center">
              <button @click="showAllCams = !showAllCams" class="text-xs text-indigo-300 hover:text-white underline">
                {{ showAllCams ? '只看重點點位' : '顯示全部 ' + cctvAll.length + ' 個點位' }}
              </button>
            </div>
          </section>

          <section v-if="direction === 'north' && freeway5" class="mt-8">
            <div class="glass-card rounded-xl p-4 flex gap-3 items-start border-sky-500/20">
              <span class="text-lg">💡</span>
              <div>
                <div class="text-xs font-semibold text-sky-300 mb-1">銜接國5路況提醒</div>
                <p class="text-sm text-slate-200 leading-relaxed">
                  {{ freeway5.queueText }}，蘇澳至台北南港車程約 {{ freeway5.minutes }} 分鐘。
                </p>
              </div>
            </div>
          </section>

          <footer class="mt-12 pt-6 border-t border-slate-800 text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>資料每 10 分鐘同步自公路局 TDX・僅供參考，請以現場標誌與官方公告為準</p>
            <div class="flex gap-4">
              <a href="https://168.thb.gov.tw/" target="_blank" class="hover:text-slate-300 underline">公路局 168 即時路況</a>
            </div>
          </footer>
        </div>
      `
    }).mount('#root');
  </script>
</body>
</html>
