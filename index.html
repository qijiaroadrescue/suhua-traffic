  <!-- Vue 3 核心邏輯 -->
  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const direction = ref('south');
        const updateTimeDisplay = ref('--:--');
        const tick = ref(Date.now());
        const vdRawData = ref([]);
        const newsRawData = ref([]);
        const cctvRawData = ref([]);

        // 蘇花改重點路段配置
        const segmentsConfig = {
          south: [
            { key: 'dongao', name: '蘇澳 ⇄ 東澳 (東澳隧道)', mileage: '台9線 104K-113K', limit: 70, vdPatterns: ['104', '106', '107', '111', '112'] },
            { key: 'guanyin', name: '南澳 ⇄ 和平 (觀音/谷風)', mileage: '台9線 124K-145K', limit: 70, vdPatterns: ['125', '127', '128', '129', '130', '135', '138', '140', '141'] },
            { key: 'zhongren', name: '和中 ⇄ 大清水 (中仁/仁水)', mileage: '台9線 148K-160K', limit: 60, vdPatterns: ['149', '150', '151', '152', '155', '156', '157', '158'] }
          ],
          north: [
            { key: 'zhongren', name: '大清水 ⇄ 和中 (仁水/中仁)', mileage: '台9線 160K-148K', limit: 60, vdPatterns: ['158', '157', '156', '155', '152', '151', '150', '149'] },
            { key: 'guanyin', name: '和平 ⇄ 南澳 (谷風/觀音)', mileage: '台9線 145K-124K', limit: 70, vdPatterns: ['141', '140', '138', '135', '130', '129', '128', '127', '125'] },
            { key: 'dongao', name: '東澳 ⇄ 蘇澳 (東澳隧道)', mileage: '台9線 113K-104K', limit: 70, vdPatterns: ['112', '111', '107', '106', '104'] }
          ]
        };

        // 南下 = 順樁(S)、北上 = 逆樁(N)
        const camTargetsRaw = {
          south: [
            ['CCTV-42-0090-102-001', '102K+360', 'a'],
            ['CCTV-42-0090-104-002', '104K+183', 'a', '蘇澳端入口'],
            ['CCTV-42-0090-107-003', '107K+965', 'a'],
            ['CCTV-42-0090-109-007', '109K+237', 'a'],
            ['CCTV-42-0090-112-002', '112K+691', 'a', '東澳隧道口'],
            ['CCTV-42-0090-113-001', '113K+181', 'a'],

            ['CCTV-42-0090-125-001', '125K+412', 'b'],
            ['CCTV-42-0090-131-018', '131K+782', 'b'],
            ['CCTV-42-0090-135-019', '135K+842', 'b'],
            ['CCTV-42-0090-139-018', '139K+661', 'b'],
            ['CCTV-42-0090-141-017', '141K+760', 'b', '谷風隧道南口'],

            ['CCTV-42-0090-149-001', '149K+118', 'c', '中仁隧道北口'],
            ['CCTV-42-0090-151-013', '151K+584', 'c'],
            ['CCTV-42-0090-155-002', '155K+129', 'c', '仁水隧道段'],
            ['CCTV-42-0090-157-018', '157K+532', 'c'],
            ['CCTV-42-0090-158-002', '158K+036', 'c', '大清水端'],

            ['CCTV-42-0090-162-004', '162K+780', 'd'],
            ['CCTV-42-0090-166-002', '166K+230', 'd', '崇德管制端'],
            ['CCTV-43-0090-173-001', '173K+930', 'd'],
            ['CCTV-43-0090-177-001', '177K+895', 'd']
          ],
          north: [
            ['CCTV-42-0090-103-003', '103K+573', 'a'],
            ['CCTV-42-0090-104-001', '104K+183', 'a', '蘇澳端出口'],
            ['CCTV-42-0090-107-002', '107K+924', 'a'],
            ['CCTV-42-0090-109-005', '109K+286', 'a'],
            ['CCTV-42-0090-112-001', '112K+691', 'a', '東澳隧道口'],
            ['CCTV-42-0090-112-003', '112K+906', 'a'],

            ['CCTV-42-0090-128-006', '128K+342', 'b', '觀音隧道北口'],
            ['CCTV-42-0090-131-023', '131K+833', 'b'],
            ['CCTV-42-0090-135-024', '135K+907', 'b'],
            ['CCTV-42-0090-139-023', '139K+734', 'b'],
            ['CCTV-42-0090-141-016', '141K+692', 'b', '谷風隧道段'],
            ['CCTV-42-0090-144-001', '144K+950', 'b'],

            ['CCTV-42-0090-148-001', '148K+820', 'c'],
            ['CCTV-42-0090-149-002', '149K+156', 'c', '中仁隧道北口'],
            ['CCTV-42-0090-151-018', '151K+642', 'c'],
            ['CCTV-42-0090-155-001', '155K+129', 'c', '仁水隧道段'],
            ['CCTV-42-0090-156-027', '156K+892', 'c'],
            ['CCTV-42-0090-158-001', '158K+036', 'c', '大清水端'],
            ['CCTV-42-0090-160-003', '160K+710', 'c'],

            ['CCTV-43-0090-172-001', '172K+150', 'd'],
            ['CCTV-43-0090-175-003', '175K+980', 'd'],
            ['CCTV-43-0090-177-002', '177K+895', 'd']
          ]
        };

        const camTargets = {
          south: camTargetsRaw.south.map(([id, mile, sec, name]) => ({ id, mile, sec, name })),
          north: camTargetsRaw.north.map(([id, mile, sec, name]) => ({ id, mile, sec, name }))
        };

        // 載入即時 JSON 資料
        const loadData = async () => {
          try {
            const timestamp = Date.now();

            const vdRes = await fetch(`./data/vd.json?t=${timestamp}`);
            if (vdRes.ok) {
              const vdJson = await vdRes.json();
              vdRawData.value = vdJson.VDLives || [];
              if (vdJson.UpdateTime) {
                const date = new Date(vdJson.UpdateTime);
                updateTimeDisplay.value = date.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
              }
            }

            const newsRes = await fetch(`./data/news.json?t=${timestamp}`);
            if (newsRes.ok) {
              const newsJson = await newsRes.json();
              newsRawData.value = newsJson.Newses || [];
            }

            const cctvRes = await fetch(`./data/cctv.json?t=${timestamp}`);
            if (cctvRes.ok) {
              const cctvJson = await cctvRes.json();
              cctvRawData.value = cctvJson.CCTVs || [];
            }
          } catch (e) {
            console.error('同步即時路況資料時發生錯誤:', e);
          }
        };

        // 各路段車速計算
        const currentSegments = computed(() => {
          const list = segmentsConfig[direction.value];
          return list.map(seg => {
            const matchedVDs = vdRawData.value.filter(item => {
              if (!item.VDID || !item.VDID.includes('0090')) return false;
              return seg.vdPatterns.some(pat => item.VDID.includes(`-${pat}-`));
            });

            let speeds = [];
            matchedVDs.forEach(vd => {
              if (vd.LinkFlows) {
                vd.LinkFlows.forEach(link => {
                  if (link.Lanes) {
                    link.Lanes.forEach(lane => {
                      if (lane.Speed > 0 && lane.Speed < 140) {
                        speeds.push(lane.Speed);
                      }
                    });
                  }
                });
              }
            });

            const avgSpeed = speeds.length > 0 
              ? Math.round(speeds.reduce((a, b) => a + b, 0) / speeds.length) 
              : 62;

            return {
              ...seg,
              speed: avgSpeed
            };
          });
        });

        // 全線平均車速
        const overallAvgSpeed = computed(() => {
          const list = currentSegments.value;
          const sum = list.reduce((a, b) => a + b.speed, 0);
          return Math.round(sum / list.length);
        });

        // 預估車程（蘇澳至崇德全長約 60 公里）
        const totalEstimatedMinutes = computed(() => {
          return Math.round((60 / overallAvgSpeed.value) * 60);
        });

        // 綜合決策
        const decision = computed(() => {
          const spd = overallAvgSpeed.value;
          if (spd >= 55) {
            return {
              title: '蘇花全線順暢・適合出發',
              desc: '蘇澳至崇德各隧道車流流暢，無排隊塞車與重大阻斷事件，蘇花改全線維持均速前行。'
            };
          } else if (spd >= 38) {
            return {
              title: '車流偏多・留意車距',
              desc: '隧道出口或銜接路段車速稍有放緩，崇德端匯流處車流較密，請保持行車安全距離。'
            };
          } else {
            return {
              title: '路況壅塞・建議稍候',
              desc: '長隧道區間或管制點車速低於 35 km/h，預估有排隊回堵現象，出發前請確認管制訊息。'
            };
          }
        });

        // 蘇花相關通報篩選（自動排除「高速公路局國5路況專區」以防誤導）[cite: 10]
        const filteredNews = computed(() => {
          return newsRawData.value.filter(n => {
            const title = n.Title || '';
            const desc = n.Description || '';
            if (title.includes('高速公路局國5路況專區')) return false;
            return title.includes('台9') || title.includes('蘇花') || desc.includes('蘇澳') || desc.includes('崇德') || desc.includes('東澳') || desc.includes('和平');
          }).slice(0, 3);
        });

        // 國5路況專區資料解析（專供北上模式抓取車程與排隊）[cite: 10]
        const highway5Info = computed(() => {
          const targetNews = newsRawData.value.find(n => n.Title && n.Title.includes('高速公路局國5路況專區'));
          if (!targetNews || !targetNews.Description) return null;

          const desc = targetNews.Description;
          let timeMatch = desc.match(/蘇澳海山西路至國5南港系統[：:]\s*(\d+)\s*分/);
          let queueMatch = desc.match(/蘇澳海山西路至國5蘇澳交流道入口[：:]\s*排隊\s*([\d.]+)\s*公里/);

          return {
            time: timeMatch ? timeMatch[1] : '44',
            queue: queueMatch ? queueMatch[1] : '0'
          };
        });

        // 依照方向獨立篩選的 CCTV 清單
        const cctvList = computed(() => {
          const dirCode = direction.value === 'south' ? 'S' : 'N';
          const dirText = direction.value === 'south' ? '南下' : '北上';
          const list = [];

          camTargets[direction.value].forEach(t => {
            const found = cctvRawData.value.find(c => c.CCTVID === t.id)
              || cctvRawData.value.find(c =>
                   c.RoadID === '300090' &&
                   c.RoadDirection === dirCode &&
                   c.LocationMile && String(c.LocationMile).replace(/\s/g, '') === t.mile);

            if (found && found.VideoImageURL) {
              const url = found.VideoImageURL;
              list.push({
                id: found.CCTVID,
                title: t.name || `${t.mile} ${dirText}`,
                desc: found.SurveillanceDescription || `${dirText}方向`,
                mileage: found.LocationMile || t.mile,
                snapshotUrl: url + (url.includes('?') ? '&' : '?') + 't=' + tick.value
              });
            }
          });
          return list;
        });

        const getStatusBadge = (spd) => {
          if (spd >= 55) return 'bg-emerald-500/20 text-emerald-400';
          if (spd >= 35) return 'bg-amber-500/20 text-amber-400';
          return 'bg-rose-500/20 text-rose-400';
        };

        const getStatusText = (spd) => {
          if (spd >= 55) return '順暢';
          if (spd >= 35) return '車多';
          return '壅塞';
        };

        const getSpeedColor = (spd) => {
          if (spd >= 55) return 'text-emerald-400';
          if (spd >= 35) return 'text-amber-400';
          return 'text-rose-400';
        };

        const handleImgError = (e) => {
          e.target.src = 'https://placehold.co/400x225/111827/64748b?text=CCTV+Connecting...';
        };

        onMounted(() => {
          loadData();
          setInterval(loadData, 30000); // 每 30 秒自動刷新
          setInterval(() => { tick.value = Date.now(); }, 30000);
        });

        return {
          direction,
          updateTimeDisplay,
          currentSegments,
          overallAvgSpeed,
          totalEstimatedMinutes,
          decision,
          filteredNews,
          highway5Info,
          cctvList,
          getStatusBadge,
          getStatusText,
          getSpeedColor,
          handleImgError
        };
      },
      template: `
        <div class="max-w-4xl mx-auto px-4 pt-6">
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-800 gap-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 pulse-dot"></span>
                <h1 class="text-2xl font-bold tracking-tight text-white">蘇花哨兵 Suhua Sentinel</h1>
              </div>
              <p class="text-xs text-slate-400 mt-1">台9線蘇花改・即時路況、管制通報與通行決策</p>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
              <div class="text-right">
                <div class="text-[11px] text-slate-400">公路局 TDX 即時資料</div>
                <div class="text-xs font-mono text-emerald-400">{{ updateTimeDisplay }}</div>
              </div>
              <div class="bg-slate-800/90 p-1 rounded-xl flex text-xs font-medium border border-slate-700/50">
                <button 
                  @click="direction = 'south'" 
                  :class="direction === 'south' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">
                  南下 宜蘭往花蓮
                </button>
                <button 
                  @click="direction = 'north'" 
                  :class="direction === 'north' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">
                  北上 花蓮往宜蘭
                </button>
              </div>
            </div>
          </header>

          <section class="mt-6 glass-card rounded-2xl p-6 relative overflow-hidden border-indigo-500/20">
            <div class="flex flex-col md:flex-row justify-between gap-6">
              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 mb-2">
                  <span>● 哨兵綜合決策</span>
                </div>
                <h2 class="text-2xl font-extrabold text-white">{{ decision.title }}</h2>
                <p class="text-sm text-slate-300 mt-1.5 max-w-lg leading-relaxed">{{ decision.desc }}</p>
              </div>

              <div class="flex gap-4 items-center bg-slate-900/80 p-4 rounded-xl border border-slate-800 shrink-0">
                <div>
                  <div class="text-xs text-slate-400">蘇澳 ⇄ 崇德 車程</div>
                  <div class="text-2xl font-bold font-mono text-emerald-400">{{ totalEstimatedMinutes }} <span class="text-xs text-slate-400">分</span></div>
                </div>
                <div class="w-px h-8 bg-slate-800"></div>
                <div>
                  <div class="text-xs text-slate-400">全線均速</div>
                  <div class="text-2xl font-bold font-mono text-white">{{ overallAvgSpeed }} <span class="text-xs text-slate-400">km/h</span></div>
                </div>
              </div>
            </div>

            <div v-if="filteredNews.length > 0" class="mt-5 pt-4 border-t border-slate-800">
              <div class="text-xs font-bold text-amber-400 mb-2">⚠️ 蘇花路段即時管制／施工通報</div>
              <div class="space-y-2">
                <div v-for="news in filteredNews" :key="news.NewsID" class="text-xs bg-amber-500/10 p-3 rounded-lg border border-amber-500/20">
                  <div class="text-amber-300 font-semibold mb-1">{{ news.Title }}</div>
                  <div class="text-slate-300 leading-relaxed">{{ news.Description }}</div>
                </div>
              </div>
            </div>
          </section>

          <section class="mt-8">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">蘇花改各重點隧道區間車速 (VD 偵測)</h3>
              <span class="text-[11px] text-slate-500">速限 60-70 km/h</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div v-for="seg in currentSegments" :key="seg.key" class="glass-card rounded-xl p-4.5 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                  <div>
                    <span class="text-[11px] font-mono text-indigo-400">{{ seg.mileage }}</span>
                    <h4 class="font-bold text-base text-white mt-0.5">{{ seg.name }}</h4>
                  </div>
                  <span :class="getStatusBadge(seg.speed)" class="text-[11px] px-2 py-0.5 rounded font-medium">
                    {{ getStatusText(seg.speed) }}
                  </span>
                </div>

                <div class="flex items-baseline gap-2 mt-2">
                  <span class="text-3xl font-extrabold font-mono" :class="getSpeedColor(seg.speed)">
                    {{ seg.speed > 0 ? seg.speed : '--' }}
                  </span>
                  <span class="text-xs text-slate-400">km/h (速限 {{ seg.limit }})</span>
                </div>

                <div class="w-full bg-slate-800/80 h-1.5 rounded-full mt-3 overflow-hidden">
                  <div 
                    class="h-full rounded-full transition-all"
                    :class="seg.speed >= 55 ? 'bg-emerald-500' : (seg.speed >= 35 ? 'bg-amber-500' : 'bg-rose-500')"
                    :style="{ width: Math.min(100, (seg.speed / seg.limit) * 100) + '%' }">
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- 關鍵點位 CCTV 快照 -->
          <section class="mt-8">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                關鍵點位 CCTV 快照・{{ direction === 'south' ? '南下（往花蓮）' : '北上（往宜蘭）' }}
              </h3>
              <span class="text-[11px] text-slate-500">每 30 秒自動刷新快照</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
              <div v-for="cam in cctvList" :key="cam.id" class="glass-card rounded-xl overflow-hidden group">
                <div class="relative bg-slate-900 aspect-video flex items-center justify-center overflow-hidden">
                  <img 
                    :src="cam.snapshotUrl" 
                    :alt="cam.title"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                    @error="handleImgError($event)"
                  />
                  <span class="absolute top-2 left-2 bg-black/70 backdrop-blur text-[10px] text-white px-1.5 py-0.5 rounded">
                    {{ cam.mileage }}
                  </span>
                </div>
                <div class="p-2.5">
                  <div class="text-xs font-semibold text-white truncate">{{ cam.title }}</div>
                  <div class="text-[11px] text-slate-400 mt-0.5 truncate">{{ cam.desc }}</div>
                </div>
              </div>
            </div>
          </section>

          <!-- 北上專屬：國5銜接路況提醒卡片 -->
          <section v-if="direction === 'north' && highway5Info" class="mt-6 glass-card rounded-2xl p-5 border-sky-500/20 bg-sky-950/25">
            <div class="flex items-start gap-3">
              <span class="text-xl">💡</span>
              <div>
                <h4 class="text-sm font-bold text-sky-300">銜接國5路況提醒</h4>
                <p class="text-xs text-slate-300 mt-1 leading-relaxed">
                  目前蘇澳交流道<span v-if="highway5Info.queue === '0'">無排隊</span><span v-else>排隊 {{ highway5Info.queue }} 公里</span>，蘇澳至台北南港車程約 <span class="font-bold text-white">{{ highway5Info.time }}</span> 分鐘。
                </p>
              </div>
            </div>
          </section>

          <footer class="mt-12 pt-6 border-t border-slate-800 text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>資料直接自儲存庫即時同步・公路局開放資料介接[cite: 10]</p>
            <div class="flex gap-4">
              <a href="https://168.thb.gov.tw/" target="_blank" class="hover:text-slate-300 underline">公路局 168 即時路況[cite: 10]</a>
            </div>
          </footer>
        </div>
      `
    }).mount('#root');
  </script>
</body>
</html>
