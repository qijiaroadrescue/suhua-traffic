  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    // ★ 部署 Cloudflare Worker 後，把這裡換成你的 Worker 網址
    const REFRESH_API = 'https://suhua-traffic-worker.qq9387036.workers.dev/';

    createApp({
      setup() {
        const direction = ref('south');
        const activeSection = ref('all');
        const showAllCCTV = ref(false);
        const updateTimeDisplay = ref('--:--');
        const vdUpdateMs = ref(0);
        const loadFailed = ref(false);
        const tick = ref(Date.now());
        const camTick = ref(Date.now());
        const vdRawData = ref([]);
        const newsRawData = ref([]);
        const cctvRawData = ref([]);
        const camCatalog = ref(null);   // data/cctv-catalog.json（含台9丁線）；不存在時退回 cctv.json
        const road = ref('台9線');       // 攝影機分頁：台9線（蘇花改）／台9丁線（舊蘇花）
        let catalogTried = false;

        // 手動更新按鈕狀態
        const refreshing = ref(false);
        const refreshMsg = ref('');
        const fetchTimeDisplay = ref('');
        const justUpdated = ref(false);        // 更新完成後短暫顯示「✓ 已更新」
        const lastRefreshDisplay = ref('');    // 最後更新：HH:MM:SS

        const STALE_MIN = 30;          // 資料超過幾分鐘提示「可按更新」
        const MIN_GAP_MS = 10 * 60000; // 資料 10 分鐘內剛更新過就不再呼叫 Worker（需與 worker.js 冷卻一致）
        const POLL_MS = 10000;         // 等待更新時，每 10 秒檢查一次
        const POLL_MAX = 24;           // 最多檢查 24 次（4 分鐘；Pages 部署約需 1～3 分鐘）

        // 路段以「里程範圍」比對偵測器（VDID 第三段的 3 位數字）
        const segBase = [
          { key: 'dongao',   from: 103, to: 113, limit: 70, nameS: '蘇澳 ⇄ 東澳 (東澳隧道)',     nameN: '東澳 ⇄ 蘇澳 (東澳隧道)',     mileS: '台9線 104K-113K', mileN: '台9線 113K-104K' },
          { key: 'guanyin',  from: 124, to: 145, limit: 70, nameS: '南澳 ⇄ 和平 (觀音/谷風)',   nameN: '和平 ⇄ 南澳 (谷風/觀音)',   mileS: '台9線 124K-145K', mileN: '台9線 145K-124K' },
          { key: 'zhongren', from: 148, to: 160, limit: 60, nameS: '和中 ⇄ 大清水 (中仁/仁水)', nameN: '大清水 ⇄ 和中 (仁水/中仁)', mileS: '台9線 148K-160K', mileN: '台9線 160K-148K' }
        ];

        // 鏡頭：直接使用 data/cctv.json 的全部攝影機（不再手動挑選）。
        // 方向：影像網址有 (S)/(N) 標示時以它為準，否則用 TDX 的 RoadDirection
        // （TDX 有一支 144K+011 的 RoadDirection 與網址標示相反，這樣可自動修正）
        const CAM_NAMES = {
          'CCTV-42-0090-104-002': '蘇澳端入口', 'CCTV-42-0090-104-001': '蘇澳端出口',
          'CCTV-42-0090-112-002': '東澳隧道口', 'CCTV-42-0090-112-001': '東澳隧道口',
          'CCTV-42-0090-128-006': '觀音隧道北口',
          'CCTV-42-0090-141-017': '谷風隧道南口', 'CCTV-42-0090-141-016': '谷風隧道段',
          'CCTV-42-0090-149-001': '中仁隧道北口', 'CCTV-42-0090-149-002': '中仁隧道北口',
          'CCTV-42-0090-155-002': '仁水隧道段', 'CCTV-42-0090-155-001': '仁水隧道段',
          'CCTV-42-0090-158-002': '大清水端', 'CCTV-42-0090-158-001': '大清水端',
          'CCTV-42-0090-166-002': '崇德管制端'
        };
        const camDir = (c) => { const m = String(c.VideoImageURL || '').match(/\(([NS])\)\/snapshot/); return m ? m[1] : c.RoadDirection; };
        // 方向正規化：TDX 偶有 NE、SW 之類的值，開頭是 N 視為北上、S 視為南下
        const normDir = (d) => { const t = String(d || ''); return t.startsWith('N') ? 'N' : t.startsWith('S') ? 'S' : t; };
        const camKm = (c) => { const m = String(c.LocationMile || '').match(/(\d+)\s*K\s*\+?\s*(\d*)/i); return m ? +m[1] + (m[2] ? +m[2] / 1000 : 0) : NaN; };
        // 區段：a=蘇澳–東澳、b=南澳–和平、c=和中–大清水、d=崇德–花蓮
        const camSec = (km) => km < 120 ? 'a' : km < 148 ? 'b' : km < 162 ? 'c' : 'd';
        // 台9丁線（舊蘇花公路，里程 0K～65K，另有幾支在 113K～148K）的區段
        const oldSec = (km) => km < 30 ? 'a' : km < 50 ? 'b' : km < 100 ? 'c' : 'd';
        const SEC_DEF = {
          '台9線': [['all', '全部'], ['a', '蘇澳–東澳'], ['b', '南澳–和平'], ['c', '和中–大清水'], ['d', '崇德–花蓮']],
          '台9丁線': [['all', '全部'], ['a', '蘇澳–東澳'], ['b', '南澳'], ['c', '澳花–和平'], ['d', '其他點位']]
        };

        const loadJson = async (name) => {
          const res = await fetch(`./data/${name}.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(name + ' ' + res.status);
          return res.json();
        };

        // 三份資料各自載入，一份失敗不影響其他（只讀靜態檔，不會消耗 TDX 點數）
        const loadData = async () => {
          let ok = true;
          try {
            const vd = await loadJson('vd');
            vdRawData.value = vd.VDLives || [];
            if (vd.UpdateTime) {
              const d = new Date(vd.UpdateTime);
              vdUpdateMs.value = d.getTime();
              updateTimeDisplay.value = d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            }
          } catch (e) { ok = false; console.error(e); }
          try { newsRawData.value = (await loadJson('news')).Newses || []; } catch (e) { console.error(e); }
          if (!catalogTried) {
            catalogTried = true;
            try { const cams = (await loadJson('cctv-catalog')).cameras; camCatalog.value = cams && cams.length ? cams : null; } catch (e) { camCatalog.value = null; }
          }
          if (!camCatalog.value) { try { cctvRawData.value = (await loadJson('cctv')).CCTVs || []; } catch (e) { console.error(e); } }
          try {
            const s = await loadJson('status');
            fetchTimeDisplay.value = new Date(s.updated).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
          } catch (e) {}
          loadFailed.value = !ok;
          if (ok) lastRefreshDisplay.value = new Date().toLocaleTimeString('zh-TW', { hour12: false });
        };

        // 讀取 status.json 的最後抓取時間（每次 Actions 執行都會更新）
        const loadStatusMs = async () => {
          try {
            const s = await loadJson('status');
            return Date.parse(s.updated) || 0;
          } catch (e) { return 0; }
        };

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        // 更新成功：按鈕短暫顯示「✓ 已更新」
        const markDone = () => {
          justUpdated.value = true;
          setTimeout(() => { justUpdated.value = false; }, 3000);
        };

        // 按鈕：通知 Worker 觸發 Actions → 等 status.json 更新 → 重新載入畫面（不重新整理整頁）
        const onRefresh = async () => {
          if (refreshing.value) return;
          refreshing.value = true;
          justUpdated.value = false;
          refreshMsg.value = '';
          try {
            const before = await loadStatusMs();

            // 剛更新過：只重新讀檔，連 Worker 都不用呼叫
            if (before && Date.now() - before < MIN_GAP_MS) {
              await loadData();
              tick.value = Date.now(); camTick.value = Date.now();
              refreshMsg.value = '資料剛更新過，已載入最新版本';
              markDone();
              return;
            }

            let res;
            try {
              res = await (await fetch(REFRESH_API, { method: 'POST' })).json();
            } catch (e) {
              throw new Error('Worker 連不上');
            }

            if (res.status === 'cooldown') {
              await loadData();
              tick.value = Date.now(); camTick.value = Date.now();
              refreshMsg.value = '剛有人更新過，已載入目前最新資料（約 ' + Math.max(1, Math.ceil(res.retryAfter / 60)) + ' 分鐘後可再更新）';
              markDone();
              return;
            }
            if (res.status !== 'started') throw new Error('Worker 回應 ' + res.status + (res.code ? ' ' + res.code : '') + (res.detail ? '：' + res.detail : ''));

            refreshMsg.value = '已通知更新，約需 1～3 分鐘…';
            for (let i = 0; i < POLL_MAX; i++) {
              await sleep(POLL_MS);
              if ((await loadStatusMs()) > before) {
                await loadData();
                tick.value = Date.now(); camTick.value = Date.now();
                refreshMsg.value = '✅ 已更新';
                markDone();
                return;
              }
            }
            refreshMsg.value = '更新時間較久，請稍後再按一次';
          } catch (e) {
            console.error(e);
            refreshMsg.value = '更新失敗（' + e.message + '）';
          } finally {
            refreshing.value = false;
          }
        };

        // 資料已經幾分鐘（用來提示是否建議按更新）
        const ageMin = computed(() => vdUpdateMs.value ? Math.floor((tick.value - vdUpdateMs.value) / 60000) : null);

        const isStale = computed(() => {
          if (!vdUpdateMs.value) return true;
          return ageMin.value > STALE_MIN;
        });

        const ageText = computed(() => {
          const m = ageMin.value;
          if (m === null) return '';
          if (m < 60) return m + ' 分鐘前';
          if (m < 1440) return Math.floor(m / 60) + ' 小時前';
          return Math.floor(m / 1440) + ' 天前';
        });

        // 各路段車速：只用狀態正常(Status 0)的偵測器；沒資料就是 null，不編數字
        const currentSegments = computed(() => {
          const north = direction.value === 'north';
          const list = north ? [...segBase].reverse() : segBase;
          return list.map(seg => {
            const speeds = [];
            vdRawData.value.forEach(vd => {
              const m = (vd.VDID || '').match(/-0090-(\d{3})-/);
              if (!m || vd.Status !== 0) return;
              const km = +m[1];
              if (km < seg.from || km > seg.to) return;
              (vd.LinkFlows || []).forEach(link => (link.Lanes || []).forEach(lane => {
                if (lane.Speed > 0 && lane.Speed < 140) speeds.push(lane.Speed);
              }));
            });
            const speed = speeds.length ? Math.round(speeds.reduce((a, b) => a + b, 0) / speeds.length) : null;
            return {
              key: seg.key, limit: seg.limit, speed,
              name: north ? seg.nameN : seg.nameS,
              mileage: north ? seg.mileN : seg.mileS
            };
          });
        });

        const overallAvgSpeed = computed(() => {
          const valid = currentSegments.value.filter(s => s.speed !== null);
          if (!valid.length) return null;
          return Math.round(valid.reduce((a, b) => a + b.speed, 0) / valid.length);
        });

        // 預估車程（蘇澳至崇德約 60 公里）
        const totalEstimatedMinutes = computed(() =>
          overallAvgSpeed.value ? Math.round((60 / overallAvgSpeed.value) * 60) : null);

        // 蘇花路段通報：台9線 100K~180K、台9丁、蘇花；排除國5專區；新的在前
        const kmOf = (t) => { const m = String(t || '').match(/(\d{2,3})K/); return m ? parseInt(m[1], 10) : null; };
        const suhuaNews = computed(() =>
          newsRawData.value.filter(n => {
            const title = n.Title || '';
            if (title.includes('國5路況專區')) return false;
            if (title.includes('台9丁') || title.includes('蘇花')) return true;
            if (!title.includes('台9')) return false;
            const km = kmOf(title);
            return km !== null && km >= 100 && km <= 180;
          }).sort((a, b) => new Date(b.PublishTime || 0) - new Date(a.PublishTime || 0)));

        const filteredNews = computed(() => suhuaNews.value.slice(0, 5));

        const closureNews = computed(() =>
          suhuaNews.value.filter(n => /封閉|管制/.test((n.Title || '') + (n.Description || ''))));

        // 綜合決策：車速 + 管制通報 + 資料狀態
        const decision = computed(() => {
          const spd = overallAvgSpeed.value;
          const closure = closureNews.value.length > 0;
          if (spd === null) {
            return { tone: 'none', badge: '● 資料不足',
              title: '暫無可靠車速資料',
              desc: '目前沒有取得正常的車速偵測資料，請參考下方鏡頭與通報，並查看公路局 168 官方路況。' };
          }
          const note = closure ? '另外，目前有封閉／管制通報，出發前請先確認下方時段。' : '';
          if (spd >= 55) {
            return { tone: closure ? 'warn' : 'ok', badge: closure ? '● 車速順暢・有管制通報' : '● 車速順暢',
              title: closure ? '車速順暢・出發前請確認管制時段' : '蘇花車速順暢・適合出發',
              desc: '各路段偵測車速正常。' + note };
          } else if (spd >= 38) {
            return { tone: 'warn', badge: '● 車流偏多',
              title: '車流偏多・留意車距',
              desc: '部分路段車速放緩，請保持安全車距。' + note };
          }
          return { tone: 'bad', badge: '● 車速偏低',
            title: '車速偏低・建議確認後再出發',
            desc: '偵測車速偏低，可能有排隊或管制，出發前請確認通報與官方路況。' + note };
        });

        const toneBadge = {
          ok: 'bg-emerald-500/20 text-emerald-300',
          warn: 'bg-amber-500/20 text-amber-300',
          bad: 'bg-rose-500/20 text-rose-300',
          none: 'bg-slate-500/20 text-slate-300'
        };

        // 國5 銜接路況：抓不到蘇澳至南港時間就整張卡片不顯示
        const highway5Info = computed(() => {
          const target = newsRawData.value.find(n => n.Title && n.Title.includes('國5路況專區'));
          if (!target || !target.Description) return null;
          const desc = target.Description;
          const timeMatch = desc.match(/蘇澳海山西路至國5南港系統[：:]\s*(\d+)\s*分/);
          const queueMatch = desc.match(/蘇澳海山西路至國5蘇澳交流道入口[：:]\s*排隊\s*([\d.]+)\s*公里/);
          if (!timeMatch) return null;
          return { time: timeMatch[1], queue: queueMatch ? queueMatch[1] : null };
        });

        // 統一格式：有清單用清單（台9線＋台9丁線），沒有就用 cctv.json（只有台9線）
        const camPool = computed(() => {
          if (camCatalog.value) return camCatalog.value.map(c => ({ id: c.id, road: c.road, dir: normDir(c.dir), mile: c.mile, km: c.km, url: c.url, desc: c.desc || '' }));
          return cctvRawData.value.filter(c => c.VideoImageURL).map(c => ({
            id: c.CCTVID, road: '台9線', dir: normDir(camDir(c)), mile: c.LocationMile, km: camKm(c), url: c.VideoImageURL, desc: c.SurveillanceDescription || ''
          }));
        });
        const hasOld = computed(() => camPool.value.some(c => c.road === '台9丁線'));
        const secList = computed(() => SEC_DEF[road.value]);

        const allCams = computed(() => {
          const dirCode = direction.value === 'south' ? 'S' : 'N';
          const dirText = direction.value === 'south' ? '南下' : '北上';
          const list = [];
          camPool.value.forEach(c => {
            if (c.road !== road.value || c.dir !== dirCode || isNaN(c.km)) return;
            const sec = road.value === '台9丁線' ? oldSec(c.km) : camSec(c.km);
            if (activeSection.value !== 'all' && sec !== activeSection.value) return;
            list.push({
              id: c.id, km: c.km,
              title: CAM_NAMES[c.id] || (c.desc && !/^台9/.test(c.desc) ? c.desc : c.road + ' ' + c.mile),
              desc: dirText + '方向',
              mileage: c.mile,
              snapshotUrl: c.url + (c.url.includes('?') ? '&' : '?') + 't=' + camTick.value
            });
          });
          // 依行車方向排序：南下由小到大，北上由大到小
          list.sort((x, y) => direction.value === 'south' ? x.km - y.km : y.km - x.km);
          return list;
        });

        const totalCctvCount = computed(() => allCams.value.length);
        const cctvList = computed(() =>
          (!showAllCCTV.value && activeSection.value === 'all' && allCams.value.length > 4)
            ? allCams.value.slice(0, 4) : allCams.value);

        const getStatusBadge = (spd) => spd === null ? 'bg-slate-500/20 text-slate-300'
          : spd >= 55 ? 'bg-emerald-500/20 text-emerald-400'
          : spd >= 35 ? 'bg-amber-500/20 text-amber-400' : 'bg-rose-500/20 text-rose-400';
        const getStatusText = (spd) => spd === null ? '無資料' : spd >= 55 ? '順暢' : spd >= 35 ? '車多' : '壅塞';
        const getSpeedColor = (spd) => spd === null ? 'text-slate-500'
          : spd >= 55 ? 'text-emerald-400' : spd >= 35 ? 'text-amber-400' : 'text-rose-400';
        const getBarColor = (spd) => spd >= 55 ? 'bg-emerald-500' : spd >= 35 ? 'bg-amber-500' : 'bg-rose-500';

        // 圖片載入失敗：換成內建的灰底圖，且只換一次，避免無限重試
        const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225"><rect width="100%" height="100%" fill="#111827"/><text x="50%" y="50%" fill="#64748b" font-size="16" text-anchor="middle" dominant-baseline="middle">影像暫時無法載入</text></svg>');
        const handleImgError = (e) => { e.target.onerror = null; e.target.src = FALLBACK_IMG; };

        const setDirection = (d) => { direction.value = d; showAllCCTV.value = false; };
        const setRoad = (r) => { road.value = r; activeSection.value = 'all'; showAllCCTV.value = false; };

        onMounted(() => {
          loadData();
          // 只重讀靜態檔與更新時間顯示，不會呼叫 TDX
          setInterval(() => { loadData(); tick.value = Date.now(); }, 30000);
          setInterval(() => { camTick.value = Date.now(); }, 60000);
        });

        return {
          direction, activeSection, showAllCCTV, updateTimeDisplay, isStale, loadFailed, ageText,
          refreshing, refreshMsg, onRefresh, fetchTimeDisplay, justUpdated, lastRefreshDisplay,
          currentSegments, overallAvgSpeed, totalEstimatedMinutes, decision, toneBadge,
          filteredNews, closureNews, highway5Info, cctvList, totalCctvCount,
          getStatusBadge, getStatusText, getSpeedColor, getBarColor, handleImgError, setDirection, road, setRoad, hasOld, secList
        };
      },
      template: `
        <div class="max-w-4xl mx-auto px-4 pt-6">
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-800 gap-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full pulse-dot" :class="isStale ? 'bg-amber-500' : 'bg-emerald-500'"></span>
                <h1 class="text-2xl font-bold tracking-tight text-white">啟佳｜宜花東路況通 </h1>
              </div>
              <p class="text-xs text-slate-400 mt-1">台9線蘇花改・即時路況、管制通報與通行參考</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
              <div class="text-right">
                <div class="text-[11px] text-slate-400">公路局 TDX 資料時間</div>
                <div class="text-xs font-mono" :class="isStale ? 'text-amber-400' : 'text-emerald-400'">{{ updateTimeDisplay }}<span v-if="ageText" class="text-slate-500">（{{ ageText }}）</span></div>
                <div v-if="fetchTimeDisplay" class="text-[11px] text-slate-500">最後抓取 {{ fetchTimeDisplay }}</div>
              </div>
              <div class="bg-slate-800/90 p-1 rounded-xl flex text-xs font-medium border border-slate-700/50">
                <button @click="setDirection('south')"
                  :class="direction === 'south' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">南下 宜蘭往花蓮</button>
                <button @click="setDirection('north')"
                  :class="direction === 'north' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">北上 花蓮往宜蘭</button>
              </div>
            </div>
          </header>

          <div class="mt-5 flex items-center justify-between gap-3">
            <h2 class="text-base font-bold text-white">🚦 即時路況</h2>
            <div class="desk-refresh">
              <span v-if="lastRefreshDisplay" class="text-xs text-slate-400">最後更新：{{ lastRefreshDisplay }}</span>
              <button class="refresh-btn" @click="onRefresh" :disabled="refreshing" :aria-label="refreshing ? '更新中' : '立即更新路況'">
                <span :class="refreshing ? 'spin' : ''" aria-hidden="true">{{ refreshing ? '⟳' : (justUpdated ? '✓' : '↻') }}</span>
                <span>{{ refreshing ? '更新中…' : (justUpdated ? '已更新' : '立即更新') }}</span>
              </button>
            </div>
          </div>
          <div v-if="refreshMsg" class="mt-2 text-xs text-slate-300" aria-live="polite">{{ refreshMsg }}</div>

          <div v-if="isStale" class="mt-4 text-xs bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-lg p-3">
            ⚠️ {{ loadFailed ? '路況資料載入失敗' : '目前顯示的路況資料已超過 30 分鐘' }}，下方數字可能不是最新，請按「立即更新」取得最新資料，並以公路局 168 官方路況為準。
          </div>

          <section class="mt-6 glass-card rounded-2xl p-6 relative overflow-hidden border-indigo-500/20">
            <div class="flex flex-col md:flex-row justify-between gap-6">
              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold mb-2" :class="toneBadge[decision.tone]">
                  <span>{{ decision.badge }}</span>
                </div>
                <h2 class="text-2xl font-extrabold text-white">{{ decision.title }}</h2>
                <p class="text-sm text-slate-300 mt-1.5 max-w-lg leading-relaxed">{{ decision.desc }}</p>
              </div>
              <div class="flex gap-4 items-center bg-slate-900/80 p-4 rounded-xl border border-slate-800 shrink-0">
                <div>
                  <div class="text-xs text-slate-400">蘇澳 ⇄ 崇德 車程</div>
                  <div class="text-2xl font-bold font-mono" :class="totalEstimatedMinutes ? 'text-emerald-400' : 'text-slate-500'">{{ totalEstimatedMinutes || '--' }} <span class="text-xs text-slate-400">分</span></div>
                </div>
                <div class="w-px h-8 bg-slate-800"></div>
                <div>
                  <div class="text-xs text-slate-400">全線均速（雙向合併）</div>
                  <div class="text-2xl font-bold font-mono text-white">{{ overallAvgSpeed || '--' }} <span class="text-xs text-slate-400">km/h</span></div>
                </div>
              </div>
            </div>

            <div v-if="filteredNews.length > 0" class="mt-5 pt-4 border-t border-slate-800">
              <div class="text-xs font-bold text-amber-400 mb-2">⚠️ 蘇花路段管制／施工通報</div>
              <div class="space-y-2">
                <div v-for="news in filteredNews" :key="news.NewsID" class="text-xs bg-amber-500/10 p-3 rounded-lg border border-amber-500/20">
                  <div class="text-amber-300 font-semibold mb-1">{{ news.Title }}</div>
                  <div class="text-slate-300 leading-relaxed">{{ news.Description }}</div>
                </div>
              </div>
            </div>
          </section>

          <section class="mt-8">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">蘇花改各重點隧道區間車速 (VD 偵測，雙向合併)</h3>
              <span class="text-[11px] text-slate-500">速限 60-70 km/h</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div v-for="seg in currentSegments" :key="seg.key" class="glass-card rounded-xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                  <div>
                    <span class="text-[11px] font-mono text-indigo-400">{{ seg.mileage }}</span>
                    <h4 class="font-bold text-base text-white mt-0.5">{{ seg.name }}</h4>
                  </div>
                  <span :class="getStatusBadge(seg.speed)" class="text-[11px] px-2 py-0.5 rounded font-medium">{{ getStatusText(seg.speed) }}</span>
                </div>
                <div class="flex items-baseline gap-2 mt-2">
                  <span class="text-3xl font-extrabold font-mono" :class="getSpeedColor(seg.speed)">{{ seg.speed !== null ? seg.speed : '--' }}</span>
                  <span class="text-xs text-slate-400">km/h (速限 {{ seg.limit }})</span>
                </div>
                <div class="w-full bg-slate-800/80 h-1.5 rounded-full mt-3 overflow-hidden">
                  <div class="h-full rounded-full transition-all" :class="getBarColor(seg.speed)"
                    :style="{ width: seg.speed !== null ? Math.min(100, (seg.speed / seg.limit) * 100) + '%' : '0%' }"></div>
                </div>
              </div>
            </div>
          </section>

          <section class="mt-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                CCTV 快照・{{ road }}・{{ direction === 'south' ? '南下（往花蓮）' : '北上（往宜蘭）' }}
              </h3>
              <div class="flex flex-wrap gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs">
                <button v-for="sc in secList" :key="sc[0]" @click="activeSection = sc[0]" :class="activeSection === sc[0] ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1 rounded-lg transition">{{ sc[1] }}</button>
              </div>
            </div>

            <div v-if="hasOld" class="mb-4 flex gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs w-fit max-w-full">
              <button @click="setRoad('台9線')" :class="road === '台9線' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition">蘇花改（台9線）</button>
              <button @click="setRoad('台9丁線')" :class="road === '台9丁線' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition">舊蘇花（台9丁線）</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
              <div v-for="cam in cctvList" :key="cam.id" class="glass-card rounded-xl overflow-hidden group">
                <div class="relative bg-slate-900 aspect-video flex items-center justify-center overflow-hidden">
                  <img :src="cam.snapshotUrl" :alt="cam.title" loading="lazy"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                    @error="handleImgError($event)" />
                  <span class="absolute top-2 left-2 bg-black/70 backdrop-blur text-[10px] text-white px-1.5 py-0.5 rounded">{{ cam.mileage }}</span>
                </div>
                <div class="p-2.5">
                  <div class="text-xs font-semibold text-white truncate">{{ cam.title }}</div>
                  <div class="text-[11px] text-slate-400 mt-0.5 truncate">{{ cam.desc }}</div>
                </div>
              </div>
            </div>

            <div v-if="activeSection === 'all' && totalCctvCount > 4" class="mt-4 text-center">
              <button @click="showAllCCTV = !showAllCCTV" class="px-5 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition">
                {{ showAllCCTV ? '收合部分點位 ▲' : '顯示全部 ' + totalCctvCount + ' 個點位 ▼' }}
              </button>
            </div>
          </section>

          <section v-if="direction === 'north' && highway5Info" class="mt-6 glass-card rounded-2xl p-5 border-sky-500/20 bg-sky-950/25">
            <div class="flex items-start gap-3">
              <span class="text-xl">💡</span>
              <div>
                <h4 class="text-sm font-bold text-sky-300">銜接國5路況提醒</h4>
                <p class="text-xs text-slate-300 mt-1 leading-relaxed">
                  <template v-if="highway5Info.queue !== null">目前蘇澳交流道<span v-if="highway5Info.queue === '0'">無排隊</span><span v-else>排隊 {{ highway5Info.queue }} 公里</span>，</template>蘇澳至台北南港車程約 <span class="font-bold text-white">{{ highway5Info.time }}</span> 分鐘。
                </p>
              </div>
            </div>
          </section>

          <section class="mt-10">
            <h3 class="text-base font-bold text-white mb-3">官方即時資訊</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <a class="official-card" href="https://www.1968services.tw/" target="_blank" rel="noopener">
                <div class="font-bold text-white">1968 即時路況</div>
                <div class="text-xs text-slate-400 mt-1">公路局</div>
              </a>
              <a class="official-card" href="https://www.thb.gov.tw/" target="_blank" rel="noopener">
                <div class="font-bold text-white">公路局</div>
                <div class="text-xs text-slate-400 mt-1">封路 / 預警公告</div>
              </a>
              <a class="official-card" href="https://www.cwa.gov.tw/V8/C/" target="_blank" rel="noopener">
                <div class="font-bold text-white">中央氣象署</div>
                <div class="text-xs text-slate-400 mt-1">雨量 / 颱風</div>
              </a>
            </div>
          </section>

          <footer class="mt-10 pt-6 border-t border-slate-800 text-xs text-slate-500 leading-relaxed space-y-3">
            <p>啟佳｜宜花東路況通為民間彙整資訊，不代表官方公告；山區路段請留意落石、起霧與臨時管制。資料來源：公路局 TDX 開放資料。</p>
            <p><strong class="text-slate-400">【免責聲明】</strong><br>本網站所載之所有資料、商標、標誌、圖像、短片、聲音檔案、連結及其他資料等（以下簡稱「資料」），僅供參考之用。本公司將盡力確保本網站資料的準確性，但對於該等資料的準確性、即時性或完整性，本公司不作任何明示或默示的保證。</p>

            <p class="text-slate-400">© 2026 啟佳道路救援 版權所有</p>
          </footer>

          <div class="fab-wrap">
            <div v-if="lastRefreshDisplay" class="fab-time">最後更新：{{ lastRefreshDisplay }}</div>
            <button class="refresh-btn" @click="onRefresh" :disabled="refreshing" :aria-label="refreshing ? '更新中' : '立即更新路況'">
              <span :class="refreshing ? 'spin' : ''" aria-hidden="true">{{ refreshing ? '⟳' : (justUpdated ? '✓' : '↻') }}</span>
              <span>{{ refreshing ? '更新中…' : (justUpdated ? '已更新' : '立即更新') }}</span>
            </button>
          </div>
        </div>
      `
    }).mount('#root');
  </script>
